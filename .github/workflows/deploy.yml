name: Deploy Trackify

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.63.103.104
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            PROD_DIR="/srv/projects/trackify/prod"
            cd "$PROD_DIR"

            echo "==> Backing up database..."
            mkdir -p backups
            docker exec trackify-database pg_dump -U trackify trackify > backups/pre_deploy_$(date +%Y%m%d_%H%M%S).sql

            echo "==> Syncing git..."
            git fetch origin master
            git reset --hard origin/master

            echo "==> Align env..."
            bash scripts/sync-production-env.sh "$PROD_DIR" || true
            # keep runtime env file in sync if script writes .env
            if [ -f "$PROD_DIR/.env" ]; then
              cp -a "$PROD_DIR/.env" /srv/projects/trackify/env/trackify.env
            fi

            echo "==> Install + build..."
            npm ci
            node ./node_modules/prisma/build/index.js generate --schema prisma/schema.prisma
            node ./node_modules/prisma/build/index.js migrate deploy --schema prisma/schema.prisma
            bash scripts/verify-production.sh source || true
            bash scripts/write-build-info.sh "$PROD_DIR" || true
            rm -rf .next dist
            npm run build
            bash scripts/verify-production.sh compiled || true

            echo "==> Restart docker trackify-prod on bitterlemon-dev..."
            cd /srv/projects/_runtime
            docker compose -f docker-compose.migrated.yml up -d trackify-prod
            docker restart trackify-prod
            sleep 3
            curl -fsS -o /dev/null http://127.0.0.1:3000/ || true

            echo "✅ Deployment complete on bitterlemon-dev!"
