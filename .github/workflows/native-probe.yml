name: native-probe
on:
  push:
    branches: [lane/native]
    paths: [.github/workflows/native-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - run: |
          sw_vers; ls /Applications | grep -i xcode; xcodebuild -version
          xcrun simctl list runtimes; xcrun simctl list devices available | head -40
          which xcodegen tuist brew; brew --version | head -1
