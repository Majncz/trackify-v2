name: Trackify
options:
  bundleIdPrefix: co.bitterlemon
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  TrackifyKit:
    path: Packages/TrackifyKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_PREVIEWS: YES

targets:
  # ───────────── iOS / iPadOS app ─────────────
  Trackify:
    type: application
    platform: iOS
    sources:
      - path: Shared
        excludes: ["Features/Billing/**", "Features/Chat/**"]   # TEMP: in progress
      - path: Intents
      - path: iOS
        excludes: ["*.plist", "*.entitlements"]
    dependencies:
      - package: TrackifyKit
      - target: TrackifyWidgets
        embed: true
        codeSign: true
    entitlements:
      path: iOS/Trackify.entitlements
      properties:
        com.apple.security.application-groups: [$(TRACKIFY_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(TRACKIFY_APP_GROUP)]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Trackify
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: co.bitterlemon.trackify
            CFBundleURLSchemes: [trackify]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKIFY_BUNDLE_ID)
        PRODUCT_NAME: Trackify
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  TrackifyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["*.plist", "*.entitlements"]
      - path: Intents
      - path: Shared/Design
    dependencies:
      - package: TrackifyKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/TrackifyWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(TRACKIFY_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(TRACKIFY_APP_GROUP)]
    info:
      path: Widgets/Info-iOS.plist
      properties:
        CFBundleDisplayName: Trackify
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKIFY_BUNDLE_ID).widgets
        PRODUCT_NAME: TrackifyWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  # ───────────── macOS menu-bar app ─────────────
  TrackifyMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
        excludes: ["Features/Billing/**", "Features/Chat/**"]   # TEMP: in progress
      - path: Intents
      - path: macOS
        excludes: ["*.plist", "*.entitlements"]
    dependencies:
      - package: TrackifyKit
      - target: TrackifyMacWidgets
        embed: true
        codeSign: true
    entitlements:
      path: macOS/TrackifyMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(TEAM_ID_PREFIX)$(TRACKIFY_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(TRACKIFY_APP_GROUP)]
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Trackify
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© Bitter Lemon"
        CFBundleURLTypes:
          - CFBundleURLName: co.bitterlemon.trackify
            CFBundleURLSchemes: [trackify]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKIFY_BUNDLE_ID).mac
        PRODUCT_NAME: Trackify
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        TEAM_ID_PREFIX: ""

  TrackifyMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
        excludes: ["*.plist", "*.entitlements"]
      - path: Intents
      - path: Shared/Design
    dependencies:
      - package: TrackifyKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/TrackifyMacWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(TEAM_ID_PREFIX)$(TRACKIFY_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(TRACKIFY_APP_GROUP)]
    info:
      path: Widgets/Info-macOS.plist
      properties:
        CFBundleDisplayName: Trackify
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKIFY_BUNDLE_ID).mac.widgets
        PRODUCT_NAME: TrackifyMacWidgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
        TEAM_ID_PREFIX: ""

  # ───────────── Tests ─────────────
  TrackifyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Trackify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKIFY_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Trackify
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Trackify:
    build:
      targets:
        Trackify: all
        TrackifyWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TrackifyUITests
  TrackifyMac:
    build:
      targets:
        TrackifyMac: all
        TrackifyMacWidgets: all
    run:
      config: Debug
    archive:
      config: Release
